
<div class="nav menu-sidebar" role="navigation" [class.expanded]="isExpanded">
  <div class="menu-header">
    <button class="menu-toggle-btn" (click)="toggleMenu()" [attr.aria-label]="isExpanded ? 'Collapse menu' : 'Expand menu'">
      <mat-icon class="toggle-icon" *ngIf="isExpanded">chevron_left</mat-icon>
      <mat-icon class="toggle-icon" *ngIf="!isExpanded">chevron_right</mat-icon>
      <span class="menu-label" *ngIf="isExpanded">Menu</span>
    </button>
  </div>
  <ul class="nav menu-list">

    <!-- <li class="nav-item">
      <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">

        <span class="item-label">Home</span>
      </a>
    </li> -->

    <!-- Categories Links -->
    <li class="nav-item" *ngFor="let category of menuItems; let i = index">
      <a class="nav-link" [routerLink]="['/category', category.MENU_CODE]" routerLinkActive="active">
        <mat-icon class="item-icon">{{ getIconForMenu(category.MENU_NAME) }}</mat-icon>
        <span class="item-label">{{ category.MENU_NAME }}</span>
      </a>
    </li>

    <!-- Spacer -->
    <li class="nav-spacer"></li>
