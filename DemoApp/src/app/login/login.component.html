

<div class="cotainer">
    <div class="d-flex justify-content-center p-5">
           <div class="card bg-success border-success text-light shadow-lg p-3 mb-5 rounded">
                <div class="card-header text-center"><h4>Login</h4></div>
                <form [formGroup]="loginForm">
                    <div class="card-body">
                        <div class="form-group row">
                            <label for="email" class="col-md-4 col-form-label text-md-right">E-Mail Address<i class="error">*</i></label>
                            <div class="input-group col-md-6">
                            
                                <span class="input-group-prepend input-group-text"><i class="fa fa-user"></i></span>
                                <input type="text" formControlName="email" id="email" class="form-control" placeholder="Enter user name" name="email" required autofocus>
                            </div>
                            <!-- <div class="error" *ngIf="loginForm.controls['email'].errors['required'] || loginForm.controls['email'].errors['email']">
                                Invalid email! 
                            </div> -->
                        </div>
                        <div class="form-group row">
                            <label for="password" class="col-md-4 col-form-label text-md-right">Password</label>
                            <div class="input-group col-md-6">
                                <span class="input-group-prepend input-group-text"><i class="fa fa-lock"></i></span>
                                <input [type]="changetype?'password':'text'" formControlName="password" id="password" class="form-control" placeholder="Enter password" name="password" required>
                                <span class="input-group-append input-group-text"><i (click)="viewpass()" [ngClass]="visible?'fa fa-eye':'fa fa-eye-slash'"></i></span>
                            </div>
                        </div>

                        <div class="row m-4">
                            <div class="d-flex justify-content-center">
                                <div class="checkbox">
                                    <label>
                                        <input type="checkbox" formControlName="rememberMe" name="remember" class=""> Remember Me
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" [disabled]="!loginForm.valid" (click)="ProccedLogin()" class="btn btn-success border-light">
                                Login
                            </button>
                        </div>
                        <div class="d-flex justify-content-center">                        
                            <a href="#" class="btn btn-link text-light">
                                Forgot Your Password?
                            </a>
                        </div>
                </div>

            </form>
           
       </div>
    </div>
</div>
