<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <form [formGroup]="loginForm">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email"
          id="email"
          formControlName="email" 
          placeholder="Enter your email address" 
          required
          autofocus>
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          [type]="changetype ? 'password' : 'text'"
          id="password"
          formControlName="password" 
          placeholder="Enter your password"
          required>
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <!-- Form Options -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe" name="remember">
          <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" class="forgot-password">Forgot password?</a>
      </div>

      <!-- Login Button -->
      <button 
        type="submit"
        [disabled]="!loginForm.valid"
        (click)="ProccedLogin()"
        class="login-button">
        Sign In
      </button>

      <!-- Social Login Divider -->
      <div class="divider">
        <span>or continue with</span>
      </div>

      <!-- Social Login Buttons -->
      <div class="social-login">
        <button type="button" class="social-button">
          <mat-icon>g_translate</mat-icon>
          Google
        </button>
        <button type="button" class="social-button">
          <mat-icon>language</mat-icon>
          Facebook
        </button>
      </div>

      <!-- Sign Up Link -->
      <div class="signup-link">
        Don't have an account? <a routerLink="/register">Sign up here</a>
      </div>
    </form>
  </div>
</div>
