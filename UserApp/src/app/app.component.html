<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --red-to-pink-to-purple-vertical-gradient: linear-gradient(
      180deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --red-to-pink-to-purple-horizontal-gradient: linear-gradient(
      90deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --pill-accent: var(--bright-blue);

    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* header / nav professional styles */
  .app-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
    border-bottom: 1px solid rgba(15,23,42,0.05);
    box-shadow: 0 2px 6px rgba(16,24,40,0.04);
    backdrop-filter: blur(4px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .app-logo {
    width: 44px;
    height: 44px;
    object-fit: contain;
    border-radius: 8px;
    background: #fff;
    padding: 4px;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06);
  }

  .app-name {
    font-weight: 700;
    color: #fff;
    font-size: 1rem;
    line-height: 1;
  }

  .app-tagline {
    font-size: 0.78rem;
    color: #dbeafe;
    margin-top: 2px;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav a {
    color: #dbeafe;
    text-decoration: none;
    padding: 0.45rem 0.6rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: background 160ms ease, color 160ms ease, transform 120ms ease;
  }

  .nav a:hover,
  .nav a.active {
    background: rgba(255,255,255,0.12);
    color: #fff;
    transform: translateY(-1px);
  }

  /* small screen adjustments */
  @media (max-width: 640px) {
    .app-header {
      padding: 0.5rem 0.75rem;
    }
    .app-logo { width: 36px; height: 36px; }
    .app-name { font-size: 0.95rem; }
    .nav a { padding: 0.4rem 0.5rem; font-size: 0.9rem; }
  }

  /* existing app styles below (unchanged) */
  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    padding: 1.5rem 1rem 1rem 1rem;
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    position: relative;
  }

  .angular-logo {
    max-width: 9.2rem;
  }

  .content {
    display: flex;
    justify-content: space-around;
    width: 100%;
    max-width: 700px;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

  .divider {
    width: 1px;
    background: var(--red-to-pink-to-purple-vertical-gradient);
    margin-inline: 0.5rem;
  }

  .pill-group {
    display: flex;
    flex-direction: column;
    align-items: start;
    flex-wrap: wrap;
    gap: 1.25rem;
  }

  .pill {
    display: flex;
    align-items: center;
    --pill-accent: var(--bright-blue);
    background: color-mix(in srgb, var(--pill-accent) 5%, transparent);
    color: var(--pill-accent);
    padding-inline: 0.75rem;
    padding-block: 0.375rem;
    border-radius: 2.75rem;
    border: 0;
    transition: background 0.3s ease;
    font-family: var(--inter-font);
    font-size: 0.875rem;
    font-style: normal;
    font-weight: 500;
    line-height: 1.4rem;
    letter-spacing: -0.00875rem;
    text-decoration: none;
  }

  .pill:hover {
    background: color-mix(in srgb, var(--pill-accent) 15%, transparent);
  }

  .pill-group .pill:nth-child(6n + 1) {
    --pill-accent: var(--bright-blue);
  }
  .pill-group .pill:nth-child(6n + 2) {
    --pill-accent: var(--french-violet);
  }
  .pill-group .pill:nth-child(6n + 3),
  .pill-group .pill:nth-child(6n + 4),
  .pill-group .pill:nth-child(6n + 5) {
    --pill-accent: var(--hot-red);
  }

  .pill-group svg {
    margin-inline-start: 0.25rem;
  }

  .social-links {
    display: flex;
    align-items: center;
    gap: 0.73rem;
    margin-top: 1.5rem;
  }

  .social-links path {
    transition: fill 0.3s ease;
    fill: var(--gray-400);
  }

  .social-links a:hover svg path {
    fill: var(--gray-900);
  }

  .user-header {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
  }
  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(16,24,40,0.10);
    background: #f0f0f0;
  }
  .user-name {
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    margin-left: 0.25rem;
    transition: color 0.2s;
  }
  .user-header:hover .user-popup,
  .user-header:focus-within .user-popup {
    display: block;
  }
  .user-popup {
    display: none;
    position: absolute;
    top: 120%;
    right: 0;
    min-width: 220px;
    background: #fff;
    color: #222;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(16,24,40,0.18);
    padding: 1rem 1.2rem 1rem 1.2rem;
    z-index: 100;
    font-size: 0.98rem;
    text-align: left;
    animation: fadeIn 0.18s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .user-popup .popup-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 0.5rem;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .user-popup .popup-name {
    font-weight: 700;
    font-size: 1.08rem;
    margin-bottom: 0.2rem;
    text-align: center;
  }
  .user-popup .popup-email {
    color: #64748b;
    font-size: 0.97rem;
    margin-bottom: 0.7rem;
    text-align: center;
  }
  .user-popup .popup-logout {
    display: block;
    width: 100%;
    margin-top: 0.7rem;
    padding: 0.55rem 0;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s;
    text-align: center;
  }
  .user-popup .popup-logout:hover {
    background: #1e40af;
  }
  /* ...existing code... */
</style>

<header class="app-header">
  <div class="header-left">
    <!-- place a logo image at src/assets/logo.png (add image to assets folder) -->
    <!-- dummy logo (replace with local asset when ready) -->
    <img
      src="https://ui-avatars.com/api/?name=UserApp&background=2563eb&color=fff&size=44"
      alt="UserApp logo"
      class="app-logo"
    />
    <div>
      <div class="app-name">{{ title }}</div>
      <div class="app-tagline">Manage users efficiently</div>
    </div>
  </div>

  <nav class="nav" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" aria-label="Home" style="display:flex;align-items:center;gap:0.3rem;">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="vertical-align:middle;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M4 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0h6" />
      </svg>
      <span class="nav-label" style="display:none;">Home</span>
    </a>
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/users" routerLinkActive="active">Users</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
    <a routerLink="/logout" routerLinkActive="active" style="display:none">Logout</a>
  </nav>
  <div *ngIf="currentUser" class="user-header" tabindex="0">
    <img [src]="currentUser.avatar" [alt]="currentUser.name" class="user-avatar" />
    <span class="user-name">{{ currentUser.name }}</span>
    <div class="user-popup">
      <img [src]="currentUser.avatar" [alt]="currentUser.name" class="popup-avatar" />
      <div class="popup-name">{{ currentUser.name }}</div>
      <div class="popup-email">{{ currentUser.email }}</div>
      <button class="popup-logout" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
