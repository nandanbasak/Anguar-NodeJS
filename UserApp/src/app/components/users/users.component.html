<div class="users-page">
  <h2>Users</h2>

  <input
    type="text"
    placeholder="Search users..."
    [(ngModel)]="searchText"
    class="pill"
    style="width:100%; margin-bottom:1rem;"
  />

  <div *ngIf="!users">Loading users…</div>
  <div *ngIf="users?.length === 0">No users found.</div>

  <div class="user-cards" *ngIf="users?.length">
    <div class="user-card" *ngFor="let user of filteredUsers">
      <img [src]="user.avatar" alt="{{ user.name }}" class="avatar" />
      <div class="user-info">
        <h3>{{ user.name }}</h3>
        <p>{{ user.email }}</p>
      </div>
    </div>
  </div>
</div>
