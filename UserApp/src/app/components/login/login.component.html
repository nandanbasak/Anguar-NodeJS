<div class="login-page">
  <h2>Login</h2>
  <form (ngSubmit)="login()" autocomplete="off">
    <input type="text" [(ngModel)]="username" name="username" placeholder="Username" required class="login-input" />
    <input type="password" [(ngModel)]="password" name="password" placeholder="Password" required class="login-input" />
    <button type="submit" class="login-btn">Login</button>
    <div class="login-error" *ngIf="errorMsg">{{ errorMsg }}</div>
  </form>
</div>
