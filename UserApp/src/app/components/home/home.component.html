<div class="home-page">
  <section class="about-section">
    <h2>Welcome to UserApp</h2>
    <p>
      UserApp is a modern Angular application for managing users, authentication, and dashboards. It demonstrates best practices in Angular, routing, guards, and UI design.
    </p>
  </section>
  <section class="gallery-section">
    <h3>Gallery</h3>
    <div class="gallery">
      <img *ngFor="let img of images" [src]="img.thumbnailUrl" [alt]="img.title" />
    </div>
  </section>
</div>
